name: Project checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: find . -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run payout tests
        run: node tests/payouts.mjs
      - name: Run smoke checks
        run: node tests/smoke.mjs
